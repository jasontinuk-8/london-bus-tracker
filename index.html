<script>

 out:['往 Ealing Broadway','Towards Ealing Broadway'],in:['往 Kingston · Brook Street','Towards Kingston · Brook Street'],
 outScroll:['往 Ealing Broadway 全線站名','All stops towards Ealing Broadway'],

 trafficTitle:['沿途交通通報','Road reports'],fullMap:['全線地圖','Full route map'],googleTrip:['Google Maps 搭車路線','Google Maps transit directions'],closeMap:['關閉','Close'],positions:['巴士位置','Bus positions'],fleet:['路線上嘅巴士','Buses on this route'],source:['到站時間由 TfL 提供。巴士位置按預測推算。','TfL arrival predictions are used to estimate bus positions.'],

function drawDestinationDisplay(){
 cancelAnimationFrame(ledFrame);
 const terminal=destinations[direction] ?? (line==='65'
   ? (direction==='outbound'?'Ealing Broadway Station':'Brook Street')
   : null);
 const heading=lineName.toUpperCase();
 const label=terminal?heading+' '+terminal.toUpperCase():heading;
 by('ledHeading').textContent=label;
 const display=by('ledDisplay');
 const glyphs={
 A:'0E111F1111',B:'1E111E111E',C:'0F1010100F',D:'1E1111111E',E:'1F101E101F',F:'1F101E1010',G:'0F1013110F',H:'11111F1111',I:'1F0404041F',J:'070101110E',K:'11121C1211',L:'101010101F',M:'111B151111',N:'1119151311',O:'0E1111110E',P:'1E111E1010',Q:'0E1111150F',R:'1E111E1211',S:'0F100E011E',T:'1F04040404',U:'111111110E',V:'1111110A04',W:'1111151B11',X:'110A040A11',Y:'110A040404',Z:'1F0204081F',
 0:'0E1115110E',1:'040C04040E',2:'0E1102041F',3:'1E0106011E',4:'0206121F02',5:'1F101E011E',6:'0E101E110E',7:'1F02040808',8:'0E110E110E',9:'0E110F010E',
 '/':'0102040810','-':'00001F0000','·':'0000040000',"'":'0404000000','.':'0000000004'
 };
 const text=label.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/’/g,"'");
 const pitch=5, rows=9;
 const columns=Math.floor((display.closest('main').clientWidth-54)/pitch);
 const width=Math.max(1,columns)*pitch;
 const scale=window.devicePixelRatio||1;
 display.style.width=width+'px';
 display.style.height=rows*pitch+'px';
 display.width=Math.round(width*scale);
 display.height=Math.round(rows*pitch*scale);
 const ctx=display.getContext('2d');
 if(!ctx){display.hidden=true;by('ledHeading').classList.remove('visually-hidden');return}
 ctx.scale(display.width/width,display.height/(rows*pitch));
 const glyphRows=[0,1,1,2,3,3,4];
 const stripWidth=text.length*6*pitch;
 const cycle=stripWidth+5*pitch;
 function paint(offset){
   ctx.clearRect(0,0,width,rows*pitch);
   for(let y=0;y<rows;y++){
     for(let x=0;x<columns;x++){
       const column=(x+offset/pitch)%(cycle/pitch);
       const glyph=glyphs[text[Math.floor(column/6)]];
       const bit=column%6;
       const row=glyphRows[y-1];
       const lit=glyph&&row!==undefined&&bit<5&&(parseInt(glyph.slice(row*2,row*2+2),16)&(16>>bit));
       ctx.fillStyle=lit?'#e2fb37':'#414637';
       if(lit){ctx.shadowColor='#c8ef32';ctx.shadowBlur=3*scale}
       ctx.beginPath();
       ctx.arc(x*pitch+2.5,y*pitch+2.5,1.85,0,Math.PI*2);
       ctx.fill();
       ctx.shadowBlur=0;
     }
   }
 }
 display.hidden=false;
 by('ledHeading').classList.add('visually-hidden');
 if(stripWidth<=width){paint(0);return}
 if(reducedMotion.matches){
   display.hidden=true;by('ledHeading').classList.remove('visually-hidden');return;
 }
 display.hidden=false;
 by('ledHeading').classList.add('visually-hidden');
 let lastOffset=0;
 const start=performance.now();
 function scroll(now){
   const offset=Math.floor(Math.max(0,now-start-850)*.042/pitch)*pitch;
   if(offset!==lastOffset){paint(offset%cycle);lastOffset=offset}
   ledFrame=requestAnimationFrame(scroll);
 }
 paint(0);
 ledFrame=requestAnimationFrame(scroll);
}
function applyLanguage(){
 drawDestinationDisplay();
 document.documentElement.lang=tr('zh-Hant','en');
 document.title=rail?lineName+' · '+tr('即時站序','Live stops'):tr(line+' 巴士 · 即時站序',line+' bus · Live stops');
 showLocationNote();
 for(const el of document.querySelectorAll('[data-copy]'))el.textContent=tr(...copy[el.dataset.copy]);
 if(rail)refreshRailJourneyLabels();
 for(const el of document.querySelectorAll('[data-label]'))el.setAttribute('aria-label',tr(...copy[el.dataset.label]));
 for(const lang of ['zh','en'])by(lang).setAttribute('aria-pressed',String(lang===language));
 if(!routes){
   by('status').textContent=stopsFailed?tr('未能載入站序，請重新整理頁面。','Unable to load stops. Reload the page.'):tr('讀取 TfL 資料中…','Loading TfL data…');
   by('selectedStop').textContent=tr('到站預測','Arrivals');
   by('centerEta').textContent=stopsFailed?tr('未有資料','No data'):tr('讀取中','Loading');
   by('vehicleDetail').textContent='';
   by('stopSummary').textContent=tr('完整站序','All stops');
 }
 searchStatus();
 for(const dir of directions)for(const entry of nodes[dir]??[])updateStopMap(entry,dir);
 renderTraffic();
 render();
}
for(const lang of ['zh','en'])by(lang).onclick=()=>{

 try{localStorage.setItem('bus65-language',lang)}catch{}
 applyLanguage();
};
const station=by('station');
const params=new URLSearchParams(location.search);
const requested=(params.get('bus')??params.get('route')??'65').trim().toUpperCase();
const validLine=/^[A-Z0-9]{1,8}$/;
const railLines={
 tube:[['bakerloo','Bakerloo'],['central','Central'],['circle','Circle'],['district','District'],['hammersmith-city','Hammersmith & City'],['jubilee','Jubilee'],['metropolitan','Metropolitan'],['northern','Northern'],['piccadilly','Piccadilly'],['victoria','Victoria'],['waterloo-city','Waterloo & City']],
 overground:[['lioness','Lioness'],['mildmay','Mildmay'],['windrush','Windrush'],['weaver','Weaver'],['suffragette','Suffragette'],['liberty','Liberty']],
 'elizabeth-line':[['elizabeth','Elizabeth line']]
};
const mode=Object.hasOwn(railLines,params.get('mode'))?params.get('mode'):'bus';
const rail=mode!=='bus';
const railOptions=railLines[mode]??[];
const selectedLine=railOptions.find(([id])=>id===params.get('line'))??railOptions[0];
const line=rail?selectedLine[0]:validLine.test(requested)&&requested!=='NORTH'&&requested!=='SOUTH'?requested:'65';
const lineName=rail?selectedLine[1]:line;
const railColours={
 bakerloo:'#B26300',central:'#DC241F',circle:'#FFC80A',district:'#007D32',
 'hammersmith-city':'#F589A6',jubilee:'#838D93',metropolitan:'#9B0058',
 northern:'#000000',piccadilly:'#0019A8',victoria:'#039BE5','waterloo-city':'#76D0BD',
 liberty:'#5D6061',lioness:'#FAA61A',mildmay:'#0077AD',weaver:'#823A62',
 suffragette:'#5BBD72',windrush:'#ED1B00',elizabeth:'#60399E'
};
const lightRailColours=new Set(['circle','hammersmith-city','jubilee','victoria','waterloo-city','lioness','suffragette']);
const routeColour=railColours[line]??'#0019A8';
const routeTextColour=lightRailColours.has(line)?'#111':'#fff';

document.documentElement.classList.toggle('double-line',doubleRailLine);

}
for(const button of document.querySelectorAll('[data-mode]')){

 button.onclick=()=>{if(button.dataset.mode!==mode)selectMode(button.dataset.mode)};
}
by('routeSearch').hidden=rail;
by('routePicker').hidden=rail;
by('railPicker').hidden=!rail;
by('railStopPicker').hidden=true;
by('outbound').parentElement.hidden=rail;
station.parentElement.hidden=rail;
for(const [id,name] of railOptions)by('railLine').add(new Option(name,id));
by('railLine').value=rail?line:'';
by('railLine').onchange=()=>selectMode(mode,by('railLine').value);
if(rail){
 Object.assign(copy,{
 brand:['倫敦交通','London Transport'],legend:['列車圖示係推算位置。閃動黃光係下一站。紅圈係上車站。','Train icon: estimated position. Flashing yellow: next stop. Red ring: boarding stop.'],

 trafficTitle:['服務狀態','Service status'],source:['到站時間由 TfL 提供。列車位置按預測推算。','TfL arrival predictions are used to estimate train positions.']
 });

}
const branches={};
const branchIndex={outbound:0,inbound:0};
let railStatus=null;
const railStop=by('railStop');
let railJourneys=[];
function refreshRailJourneyLabels(){
 const options=by('branch').options;
 railJourneys.forEach((journey,i)=>{
   if(options[i])options[i].textContent=tr('往 ','Towards ')+journey.destination.name;
 });
}
function applyRailJourney(index){
 const journey=railJourneys[index];
 if(!journey)return;

 branchIndex[direction]=journey.branchIndex;
 applyBranch(direction);
 routeGeometry=null;

function scheduledDepartures(data,nextStop,destinationStop,now){

 const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
 const today=days.indexOf(parts.weekday);
 const minuteNow=Number(parts.hour)*60+Number(parts.minute);
 const names=new Map([...(data.stations??[]),...(data.stops??[])].map(stop=>[stop.id,stop.name]));
 const departures=new Map();
 for(const route of data.timetable?.routes??[]){
   const intervals=new Map((route.stationIntervals??[]).map(entry=>[String(entry.id),entry.intervals]));
   for(const offset of [-1,0,1]){
     const day=(today+offset+7)%7;
     const dayName=days[day];
     for(const schedule of route.schedules??[]){
       const name=schedule.name??'';
       const matches=day>=1&&day<=5
         ? name===dayName||/monday\s*-\s*friday|weekdays/i.test(name)
         : new RegExp('^'+dayName+'s?\\b','i').test(name)||/saturday\s*(?:-|and|&|\/)+\s*sunday|weekends/i.test(name);
       if(!matches)continue;
       for(const journey of [...(schedule.knownJourneys??[]),schedule.firstJourney,schedule.lastJourney].filter(Boolean)){
         const path=intervals.get(String(journey.intervalId));
         if(!path?.some(stop=>stop.stopId===nextStop)||path.at(-1)?.stopId!==destinationStop)continue;
         const minutes=Number(journey.hour)*60+Number(journey.minute)+1440*offset;
         if(!Number.isFinite(minutes)||minutes<minuteNow)continue;
         const destination=names.get(path.at(-1).stopId)??'';
         departures.set(minutes+'|'+destination,{minutes,destination});

 const labels=rows.map(({minutes,destination})=>{
   const time=[Math.floor(minutes/60)%24,minutes%60].map(value=>String(value).padStart(2,'0')).join(':');
   return tr('按時間表 ','Scheduled ')+time+(minutes>=1440?tr('（聽日）',' (tomorrow)'):'')+(destination?' · '+destination:'');
 });
 if(!labels.length)labels.push(loading?tr('讀取班次表…','Loading timetable…'):
   failed?tr('暫時讀取唔到班次表。','Timetable unavailable.'):
   tr('暫無開車時間。','No scheduled departures found.'));
 if([...list.children].map(el=>el.textContent).join('\n')===labels.join('\n'))return;
 list.replaceChildren();
 labels.forEach(label=>item(list,label));
}
function render(){
 if(!stops.length)return;
 renderDepartures();
 by('stopSummary').textContent=tr('完整站序 · '+stops.length+' 個站','All stops · '+stops.length);
 const stale=updated&&Date.now()-updated>90000;
 const usable=updated&&!stale;
 const [stopId,name,letter]=stops[selected];
 const lookup=new Map(stops.map(([id],i)=>[id,i]));
 const fresh=usable?predictions.filter(p=>Date.parse(p.expectedArrival)>Date.now()-15000).sort((a,b)=>Date.parse(a.expectedArrival)-Date.parse(b.expectedArrival)):[];
 const records=fresh.filter(p=>p.direction===direction&&lookup.has(p.naptanId)&&onSelectedBranch(p));
 const arrivals=records.filter(p=>p.naptanId===stopId);
 by('selectedStop').textContent=name+(letter?' · '+letter:'');
 by('centerEta').textContent=arrivals.length?eta(arrivals[0]):usable?tr("暫無預測","No predictions"):failed||stale?tr("未有資料","No data"):tr("讀取中","Loading");
 by('status').textContent=usable?tr("TfL 更新","Updated ")+new Date(updated).toLocaleTimeString('en-GB',{timeZone:'Europe/London'})+(failed?tr(" · 更新失敗，顯示上次資料","Refresh failed, showing last update"):tr(" · 倫敦時間","London time")):stale?tr("資料已過期，等候更新","Data expired, awaiting refresh"):failed?tr("暫時連唔到 TfL，請重試。","TfL unavailable. Try refreshing."):tr("讀取 TfL 資料中…","Loading TfL data\u2026");
 by('centerEta').parentElement.querySelector(':scope > .arrival-delay')?.remove();
 const list=by('arrivals');list.replaceChildren();
 if(!arrivals.length)item(list,usable?tr("TfL 暫時未有呢個站嘅預測。","No TfL predictions for this stop."):tr("等候即時到站資料。","Waiting for live arrivals."));
 else arrivals.slice(0,3).forEach((p,index)=>{
   item(list,eta(p)+(rail?[p.destinationName,p.platformName].filter(Boolean).map(value=>' · '+value).join(''):''));
   const previous=p.vehicleId?previousArrivals.get(arrivalKey(p)):undefined;
   const minutes=Math.round((Date.parse(p.expectedArrival)-previous)/60000);
   if(!(minutes>0))return;
   const delay=document.createElement('small');
   delay.className='arrival-delay';
   delay.textContent=tr('預計遲 '+minutes+' 分鐘','Expected '+minutes+' min later');
   if(index===0)by('centerEta').after(delay);
   else list.lastElementChild.append(delay);
   const next=records.find(candidate=>candidate.vehicleId===p.vehicleId && arrivalKey({...candidate,naptanId:p.naptanId})===arrivalKey(p));
   const firstSegment=lookup.get(next?.naptanId)-1;
   const relevant=[...matchedReports].filter(([segment])=>segment>=firstSegment&&segment<selected);
   const locations=[...new Set(relevant.flatMap(([,reports])=>reports.map(report=>report.location).filter(Boolean)))];
   if(locations.length){
     const note=document.createElement('span');
     note.className='arrival-delay';
     note.textContent=tr('沿途 TfL 通報：','TfL reports ahead: ')+locations.join(' · ');
     delay.append(note);
   }
 });
 const groups={outbound:new Map(),inbound:new Map()};
 const routeIds=Object.fromEntries(directions.map(dir=>[dir,new Set(routes[dir].map(row=>row[0]))]));
 const seen=new Set();
 for(const p of fresh){
   if(!p.vehicleId||seen.has(p.vehicleId)||!routeIds[p.direction]?.has(p.naptanId)||!onSelectedBranch(p))continue;
   seen.add(p.vehicleId);
   const line=groups[p.direction];
   if(!line.has(p.naptanId))line.set(p.naptanId,[]);
   line.get(p.naptanId).push(p);
 }
 for(const dir of directions){
   routes[dir].forEach(([id,name],index)=>{
     const {node,label}=nodes[dir][index];
     const group=groups[dir].get(id)??[];
     const isSelected=dir===direction&&index===selected;
     node.dataset.selected=String(isSelected);
     label.setAttribute('aria-pressed',String(isSelected));
     const following=routes[dir][index+1];
     const current=following?groups[dir].get(following[0])??[]:[];
     const vehicles=[...current,...group];
     node.classList.toggle('current',current.length>0);
     node.classList.toggle('next',group.length>0);
     node.classList.toggle('tracked',chosen?.dir===dir&&current.some(p=>chosen.ids.has(p.vehicleId)));
     node.setAttribute('aria-label',[name,current.length?tr("巴士推算位置","Estimated bus position"):'',group.length?tr("巴士預計下一站","Expected next stop"):''].filter(Boolean).join(' · '));
     node.onclick=vehicles.length?()=>{
       const ids=new Set(vehicles.map(p=>p.vehicleId));
       const wasSelected=chosen?.dir===dir&&chosen.ids.size===ids.size&&[...ids].every(id=>chosen.ids.has(id));
       chosen=wasSelected?null:{dir,ids};render();
     }:label.onclick;
   });
 }
 const fleet=[...groups[direction].values()].flat().sort((a,b)=>a.vehicleId.localeCompare(b.vehicleId));
 mapFleet=fleet;
 drawLiveMap();
 renderFleet(fleet,lookup);
 const details=by('vehicleList');details.replaceChildren();
 by('vehiclePanel').classList.toggle('active',!!chosen);
 by('stopInfoPanel').hidden=!!chosen;
 if(chosen){
   const selectedDirection=chosen.dir;
   const selectedVehicles=[...chosen.ids].map(vehicleId=>({
     vehicleId,
     calls:vehicleJourney(vehicleId,selectedDirection)
   })).filter(vehicle=>vehicle.calls.length);
   const destination=towards(selectedDirection);
   by('vehicleDetail').textContent=selectedVehicles.length
     ?destination+tr(' · 後續停站及預計時間',' · Upcoming stops and expected times')
     :tr("暫無後續停站預測。","No upcoming stop predictions.");
   selectedVehicles.forEach(({vehicleId,calls})=>{
     const heading=document.createElement('li');
     heading.className='journey-vehicle';
     heading.textContent=vehicleLabel(vehicleId);
     details.append(heading);
     const firstIndex=lookup.get(calls[0].naptanId);
     const position=firstIndex>0
       ?tr('推算位置：','Estimated position: ')+stops[firstIndex-1][1]+' → '+stops[firstIndex][1]
       :tr('預計由總站開出','Expected to depart terminus');
     item(details,position);
     calls.forEach(p=>{
       const stopIndex=routes[selectedDirection].findIndex(([id])=>id===p.naptanId);
       item(details,stopAndTime(p),()=>{
         if(stopIndex<0)return;
         if(direction!==selectedDirection){direction=selectedDirection;setDirection(false)}
         choose(stopIndex);
       });
     });
   });
 }else{
   const count=fleet.length;
   by('vehicleDetail').textContent=rail?(count?tr(count+' 架列車有預測。',count+' trains with predictions.'):tr('暫無列車位置。','No train positions available.')):count?tr(count+' 架車有預測，撳巴士圖示或黃燈睇詳情。',count+' bus'+(count===1?'':'es')+' with predictions. Select a bus icon or yellow light.'):tr("暫無巴士位置。","No bus positions available.");
 }
}

async function refresh(){
 if(busy||!routes)return;
 busy=true;
 try{
   const response=await fetch('https://api.tfl.gov.uk/Line/'+line+'/Arrivals',{cache:'no-store',signal:AbortSignal.timeout(12000)});
   if(!response.ok)throw Error(response.status);
   const data=await response.json();
   if(!Array.isArray(data))throw Error('Invalid arrivals');
   previousArrivals=new Map(Date.now()-updated<90000
     ? predictions.filter(p=>p.vehicleId&&Date.parse(p.expectedArrival)>Date.now())
       .map(p=>[arrivalKey(p),Date.parse(p.expectedArrival)])
     : []);
   predictions=data;updated=Date.now();failed=false;
 }catch{failed=true}
 finally{busy=false;render()}
}
for(const dir of directions)by(dir).onclick=()=>{if(routes?.[dir]?.length&&direction!==dir){direction=dir;setDirection()}};
station.onchange=()=>choose(Number(station.value));
let trafficSelection=null, trafficReports=null, routeGeometry=null;
let matchedReports=new Map(), previousArrivals=new Map();
const arrivalKey=p=>JSON.stringify([p.vehicleId,p.direction,p.naptanId,p.destinationNaptanId??p.destinationName]);
const trafficApi='https://api.tfl.gov.uk/';
async function trafficJson(path){
 const response=await fetch(trafficApi+path,{signal:AbortSignal.timeout(12000)});
 if(!response.ok)throw Error(response.status);
 return response.json();
}
function project(point,path,minimum=0){
 const lonScale=Math.cos(point[1]*Math.PI/180);
 let best={metres:Infinity,offset:0};
 for(let i=Math.floor(minimum);i<path.length-1;i++){
   const a=path[i],b=path[i+1];
   const x=(b[0]-a[0])*lonScale,y=b[1]-a[1];
   const px=(point[0]-a[0])*lonScale,py=point[1]-a[1];
   const length=x*x+y*y;
   if(!length)continue;
   const t=Math.max(Math.max(0,minimum-i),Math.min(1,(px*x+py*y)/length));
   const metres=Math.hypot(px-x*t,py-y*t)*111195;
   if(metres<best.metres)best={metres,offset:i+t};
 }
 return best;
}
function matchedGeometry(data,stops,positions){
 const paths=(data.lineStrings??[]).flatMap(value=>JSON.parse(value));
 for(const path of paths){
   if(path.length<2)continue;
   for(const points of [path,[...path].reverse()]){
     const offsets=[];
     for(const [id] of stops){
       if(!positions.has(id))break;
       const projected=project(positions.get(id),points,offsets.at(-1)??0);
       if(projected.metres>100)break;
       offsets.push(projected.offset);
     }
     if(offsets.length===stops.length)return {points,offsets};
   }
 }
 return null;
}
async function refreshTraffic(){
 const selectedRoutes=directions.map(dir=>routes[dir]);
 const geometries=Promise.allSettled(directions.map(async dir=>{
   if(!routes[dir].length)return null;
   if(routeGeometry?.[dir])return routeGeometry[dir];
   const data=await trafficJson('Line/'+encodeURIComponent(line)+'/Route/Sequence/'+dir);
   if(routes[dir]!==selectedRoutes[directions.indexOf(dir)])return null;
   stopCoordinates[dir]=new Map(data.stopPointSequences.flatMap(seq=>seq.stopPoint)
     .filter(stop=>Number.isFinite(stop.lat)&&Number.isFinite(stop.lon))
     .map(stop=>[stop.id,[stop.lon,stop.lat]]));
   for(const entry of nodes[dir])updateStopMap(entry,dir);
   const selectedStops=selectedRoutes[directions.indexOf(dir)];
   const geometry=matchedGeometry(data,selectedStops,stopCoordinates[dir]);
   if(geometry||!rail)return geometry;
   const points=selectedStops.map(([id])=>stopCoordinates[dir].get(id));
   return points.length>1&&points.every(Boolean)
     ?{points,offsets:points.map((_,i)=>i),approximate:true}
     :null;
 })).then(results=>Object.fromEntries(directions.map((dir,i)=>[dir,results[i].value??null])));
 const [geometry, reports]=await Promise.all([geometries,trafficJson(rail?'Line/'+line+'/Status':'Road/all/Disruption?stripContent=true').catch(()=>null)]);
 if(directions.some((dir,i)=>routes[dir]!==selectedRoutes[i]))return;
 if(rail)railStatus=reports;
 if(directions.some(dir=>geometry[dir]))routeGeometry=geometry;
 trafficReports=Array.isArray(reports)?reports:null;
 renderTraffic();render();
}
function renderTraffic(){
 updateRouteLinks();
 if(!routes||!nodes[direction]||!stops.length)return;
 const geometry=routeGeometry?.[direction];
 const available=!rail&&geometry&&trafficReports;
 const matches=new Map();
 if(available){
   const {points,offsets}=geometry;
   for(const report of trafficReports){
     const now=Date.now();
     if(Date.parse(report.startDateTime)>now||Date.parse(report.endDateTime)<now)continue;
     let point;
     try{point=JSON.parse(report.point)}catch{continue}
     if(!Array.isArray(point)||point.length!==2||!point.every(Number.isFinite))continue;
     const nearest=project(point,points);
     if(nearest.metres>45||nearest.offset<offsets[0])continue;
     const next=offsets.findIndex(offset=>offset>nearest.offset);
     if(next<1)continue;
     const index=next-1;
     if(!matches.has(index))matches.set(index,[]);
     matches.get(index).push(report);
   }
 }
 matchedReports=matches;
 if(by('routeMapDialog').open)drawFullRoute();
 nodes[direction].slice(0,-1).forEach(({traffic},index)=>{
   const reports=matches.get(index)??[];
   traffic.hidden=!reports.length;
   traffic.setAttribute('aria-label',tr('交通通報：','Road reports: ')+stops[index][1]+' → '+stops[index+1][1]);
   traffic.setAttribute('aria-pressed',String(trafficSelection===index));
 });
 const detail=by('trafficDetail');
 if(rail){
   const statuses=railStatus?.[0]?.lineStatuses??[];
   detail.textContent=statuses.map(s=>s.reason||s.statusSeverityDescription).filter(Boolean).join('\n')||tr('暫未有服務狀態。','Service status unavailable.');
   return;
 }
 const unavailable=tr('暫未有可用嘅路段資料。','Segment data unavailable.');
 if(trafficSelection===null){
   detail.textContent=available?(matches.size?tr('撳 ⚠️ 睇通報。','Select ⚠️ to read a report.'):tr('暫無配對通報。','No matched reports.')):unavailable;
   return;
 }
 const reports=matches.get(trafficSelection)??[];
 const message=reports.length?reports.map(roadReportText).join('\n\n'):available?tr('暫無配對通報。','No matched reports.'):unavailable;
 detail.textContent=stops[trafficSelection][1]+' → '+stops[trafficSelection+1][1]+'\n'+message;
}
async function start(){
 try{
   if(line==='65'||line==='371'){
     const response=await fetch(line==='65'?'stops.json':'stops-371.json');
     if(!response.ok)throw Error(response.status);
     routes=await response.json();
   }else{
     const results=await Promise.all(directions.map(async dir=>{
       const url='https://api.tfl.gov.uk/Line/'+encodeURIComponent(line)+'/Route/Sequence/'+dir;
       const response=await fetch(url,{signal:AbortSignal.timeout(15000)});
       if(response.status===404)return [];
       if(!response.ok)throw Error(response.status);
       const data=await response.json();
       if(data.mode&&data.mode!==mode)return [];
       const segments=(data.stopPointSequences??[]).filter(seq=>seq.stopPoint?.length);
       const sequences=rail?railRouteSequences(data,segments):segments;
       if(rail)branches[dir]=sequences;
       hasVariants ||= !rail&&sequences.length>1;
       const longest=sequences.sort((a,b)=>b.stopPoint.length-a.stopPoint.length)[0];
       stopCoordinates[dir]=new Map((longest?.stopPoint??[])
         .filter(stop=>Number.isFinite(stop.lat)&&Number.isFinite(stop.lon))
         .map(stop=>[stop.id,[stop.lon,stop.lat]]));
       return (longest?.stopPoint??[]).map(stop=>[stop.id,stop.name,stop.stopLetter??'']);
     }));
     if(!results.some(stops=>stops.length)){routeError='missing';throw Error('Route not found')}
     routes=Object.fromEntries(directions.map((dir,i)=>[dir,results[i]]));
   }
   if(rail)directions.forEach(applyBranch);
   by('locate').disabled=false;
   if(!routes[direction].length)direction=directions.find(dir=>routes[dir].length);
   for(const [dir,key] of [['outbound','out'],['inbound','in']]){
     const last=routes[dir].at(-1);
     if(!last)continue;
     destinations[dir]=last[1];
     by(dir).textContent=destinations[dir];
     copy[key]=['往 '+destinations[dir],'Towards '+destinations[dir]];
     copy[key+'Scroll']=['往 '+destinations[dir]+' 全線站名','All stops towards '+destinations[dir]];
   }
   createTracks();applyLanguage();
   setDirection();if(rail)setupRailJourneyPicker();refreshTraffic();setInterval(refreshTraffic,300000);refresh();setInterval(refresh,30000);setInterval(render,5000);
 }catch{stopsFailed=true;routeError ||= 'unavailable';applyLanguage()}
}
by('routeInput').value=line;
for(const dir of directions)by(dir).hidden=true;
for(const route of ['65','371']){
 const button=by('route'+route);
 button.setAttribute('aria-pressed',String(route===line));
 button.onclick=()=>{if(route!==line)location.search='?route='+route};
}
const official=document.querySelector('[data-copy="official"]');
official.href=rail?'https://tfl.gov.uk/'+(mode==='tube'?'tube':mode==='overground'?'overground':'elizabeth-line')+'/':'https://tfl.gov.uk/bus/route/'+line+'/';
copy.official=['TfL '+lineName+' 官方路線','Official TfL route '+lineName];
window.addEventListener('resize',drawDestinationDisplay);
reducedMotion.addEventListener?.('change',drawDestinationDisplay);
applyLanguage();
if(!params.has('bus')&&params.get('route')==='sl7')location.replace('map.html?route=sl7');else start();
</script>
