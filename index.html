<style>

.layout{grid-template-columns:1fr}.layout .diagram{padding:12px}.track-heading{display:flex;align-items:center;gap:8px;margin:0;padding:8px 0;font-size:16px}.arrow{background:#134c38;color:white;border-radius:6px;padding:2px 8px}.viewport{overflow-x:auto;overscroll-behavior-inline:contain;border:1px solid #d5e0d8;border-radius:10px;background:#f8faf7}.track{display:flex;width:max-content;min-width:100%;padding:0 12px;position:relative}.track::before{content:'';position:absolute;inset:38px 56px auto;border-top:4px solid #a1cbb1}.track.inbound{flex-direction:row-reverse;border-top:1px solid #d5e0d8}.stop-cell{width:100px;flex:none;text-align:center;position:relative;padding:0 3px 10px}.stop-node{display:flex;align-items:center;justify-content:center;gap:1px;width:54px;height:54px;margin:12px auto 4px;border:3px solid transparent;border-radius:50%;background:transparent;padding:0;color:#144b38;font-weight:800}.stop-node.active{border-color:#11714e;background:#e5f5eb}.stop-node[data-selected=true]{box-shadow:0 0 0 2px #254c3e}.stop-node svg{width:17px;height:17px;background:none;border-radius:0}.station-label{background:transparent;border:0;padding:3px 0;width:100%;min-height:55px;font-size:12px;line-height:1.25;overflow-wrap:anywhere}.station-label[aria-pressed=true]{font-weight:750;color:#07543c}.station-letter{display:block;font-size:11px;color:#496456;margin-top:4px}.viewport:focus-visible{outline:2px solid #11714e}.legend{margin:8px 0}.side{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}.side .status{grid-column:1/-1}.side h2{margin-top:4px}@media(max-width:600px){.side{grid-template-columns:1fr}}

body,.viewport,.status{background:#fff;color:#111}.card,.viewport{border-color:#ddd}.muted{color:#333}.num,.arrow{background:#7619d8}.track{--route-color:#7619d8}.track.inbound{--route-color:#0877b9}.track-heading:has(+ #inboundViewport) .arrow{background:#0877b9}
.track::before{top:32px;border-top:16px solid var(--route-color);border-radius:12px}.stop-node{border:0;position:relative;color:#111;font-size:0}.stop-node::before{content:'';width:12px;height:12px;border-radius:50%;background:#fff}.stop-node.active{border:5px solid #cf162b;background:transparent;width:36px;height:36px;margin-top:21px;margin-bottom:13px;font-size:0}.stop-node[data-selected=true]{box-shadow:none}.stop-node.active::after{content:attr(data-arrow);font-size:20px;color:#cf162b;position:absolute;left:31px;top:-2px}.inbound .stop-node.active::after{left:auto;right:31px}

.route-columns{display:grid;grid-template-columns:minmax(0,1fr)}.track-heading{min-height:48px}.viewport{height:min(62vh,620px);overflow:auto;overscroll-behavior:contain}.track,.track.inbound{display:block;width:100%;padding:8px;border:0}.track::before{inset:8px auto 8px 14px;border:0;width:20px;background:var(--route-color)}.stop-cell{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;text-align:left;width:100%;min-height:36px;padding:0}.station-label{text-align:left;min-height:36px;font-size:13px;padding-left:4px}.stop-node,.stop-node.active{width:32px;height:32px;margin:0;border:0;background:transparent}.stop-node.active::after,.inbound .stop-node.active::after{content:none}.stop-node.current::before,.stop-node.next::before{width:21px;height:21px;background:#ffe04a;border:2px solid #8a6400;box-shadow:0 0 6px 3px #ffdb27,0 0 13px #ffcf00}.stop-node.next::before{animation:next-glow 1.5s ease-in-out infinite}.stop-node.current.next::before{animation:none}.stop-node.current.next{animation:next-outline 1.5s ease-in-out infinite}.stop-node[data-selected=true]{outline:3px solid #cf162b;outline-offset:1px}.station-label[aria-pressed=true]{color:#a91022}@keyframes next-glow{50%{opacity:.34;box-shadow:none}}@keyframes next-outline{50%{box-shadow:0 0 0 3px #ffd400}}@media(prefers-reduced-motion:reduce){.stop-node.next::before,.stop-node.current.next{animation:none}.stop-node.next{border:2px dashed #8a6400}}

 .layout{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:6px}
 .layout .diagram,.layout .side{padding:6px}
 .track-heading{font-size:13px;min-height:36px}
 .station-label{font-size:12px}

 .side p,.side li{overflow-wrap:anywhere;font-size:12px}

.route-search{display:flex;align-items:end;flex-wrap:wrap;gap:6px;margin:0 0 12px}.route-search input{width:108px;padding:8px;border:1px solid #bbb;border-radius:8px;font:inherit}.route-search label{display:grid;gap:4px}.route-search button{background:#111;color:#fff}.route-search p{margin:0;flex-basis:100%}.route-search p:empty{display:none}

<main>
<header><strong data-copy="brand"></strong><nav><button id="zh" aria-pressed="true" lang="zh-Hant">中</button><button id="en" aria-pressed="false" lang="en">ENG</button></nav></header>
<h1><span class="num" id="routeNumber">65</span><span data-copy="title"></span></h1>
<form id="routeSearch" class="route-search"><label><span data-copy="searchLabel"></span><input id="routeInput" maxlength="8" placeholder="65, K3, SL7" required></label><button data-copy="search"></button><p id="searchNote" class="muted" role="status"></p></form><div class="controls"><div class="choices" id="routePicker" role="group" data-label="route"><button id="route65">65</button><button id="route371">371</button></div><div class="choices" role="group" data-label="direction"><button id="outbound" aria-pressed="true">Ealing Broadway</button><button id="inbound" aria-pressed="false">Kingston · Brook Street</button></div><label><span data-copy="boarding"></span> <select id="station"></select></label></div>
<div class="layout">
<section class="card diagram">
<div class="route-columns"><div id="outboundPanel"><h2 class="track-heading"><span class="arrow" aria-hidden="true">↓</span> <span data-copy="out"></span></h2>
<div id="outboundViewport" class="viewport" tabindex="0" data-label="outScroll"><div class="track" id="outboundTrack"></div></div></div><div id="inboundPanel" hidden>
<h2 class="track-heading"><span class="arrow" aria-hidden="true">↓</span> <span data-copy="in"></span></h2>
<div id="inboundViewport" class="viewport" tabindex="0" data-label="inScroll"><div class="track inbound" id="inboundTrack"></div></div></div></div>
<p class="muted legend" data-copy="legend"></p>
</section>
<section class="card side">
<p class="status muted" id="status" role="status">讀取 TfL 資料中… / Loading TfL data…</p>
<div><h2 id="selectedStop">到站預測 / Arrivals</h2><strong class="count" id="centerEta">讀取中 / Loading</strong><ul class="list" id="arrivals"></ul></div>
<div><h2 data-copy="positions"></h2><p class="muted" id="vehicleDetail">撳黃燈睇下一站。 / Select a yellow light to see the next stop.</p><ul class="list" id="vehicleList"></ul><h2 data-copy="fleet"></h2><div class="fleet" id="fleetList"></div></div>
</section>
</div>
<details class="card stops"><summary id="stopSummary">完整站序 · All stops</summary><ol id="stopList"></ol></details>
<p class="source muted"><span data-copy="source"></span> <a href="https://tfl.gov.uk/bus/route/65/" target="_blank" rel="noopener" data-copy="official"></a></p>
</main>
<script>
const by=id=>document.getElementById(id);
let language='zh';
try{if(localStorage.getItem('bus65-language')==='en')language='en'}catch{}
const tr=(zh,en)=>language==='en'?en:zh;
const copy={
 brand:['倫敦巴士','London Buses'],
 route:['巴士路線','Bus route'],searchLabel:['巴士號碼','Bus number'],search:['搜尋','Search'],title:['即時站序','Live stops'],direction:['行車方向','Direction'],boarding:['上車站','Boarding stop'],
 out:['往 Ealing Broadway','Towards Ealing Broadway'],in:['往 Kingston · Brook Street','Towards Kingston · Brook Street'],
 outScroll:['往 Ealing Broadway 全線站名','All stops towards Ealing Broadway'],
 inScroll:['往 Kingston 全線站名','All stops towards Kingston'],
 legend:['長亮黃光：巴士推算位置。閃動黃光：預計下一站。紅圈：上車站。','Steady yellow: estimated bus position. Flashing yellow: next stop. Red ring: boarding stop.'],
 positions:['巴士位置','Bus positions'],fleet:['路線上嘅巴士','Buses on this route'],source:['到站時間由 TfL 提供。巴士位置按預測推算。','TfL arrival predictions are used to estimate bus positions.'],
 official:['TfL 65 官方路線','Official TfL route 65']
};
let stopsFailed=false;
function applyLanguage(){
 document.documentElement.lang=tr('zh-Hant','en');
 document.title=tr(line+' 巴士 · 即時站序',line+' bus · Live stops');
 for(const el of document.querySelectorAll('[data-copy]'))el.textContent=tr(...copy[el.dataset.copy]);
 for(const el of document.querySelectorAll('[data-label]'))el.setAttribute('aria-label',tr(...copy[el.dataset.label]));
 for(const lang of ['zh','en'])by(lang).setAttribute('aria-pressed',String(lang===language));
 if(!routes){
   by('status').textContent=stopsFailed?tr('未能載入站序，請重新整理頁面。','Unable to load stops. Reload the page.'):tr('讀取 TfL 資料中…','Loading TfL data…');
   by('selectedStop').textContent=tr('到站預測','Arrivals');
   by('centerEta').textContent=stopsFailed?tr('未有資料','No data'):tr('讀取中','Loading');
   by('vehicleDetail').textContent='';
   by('stopSummary').textContent=tr('完整站序','All stops');
 }
 searchStatus();
 render();
}
for(const lang of ['zh','en'])by(lang).onclick=()=>{
 language=lang;
 try{localStorage.setItem('bus65-language',lang)}catch{}
 applyLanguage();
};
const station=by('station');
const params=new URLSearchParams(location.search);
const requested=(params.get('bus')??params.get('route')??'65').trim().toUpperCase();
const validLine=/^[A-Z0-9]{1,8}$/;
const line=validLine.test(requested)&&requested!=='NORTH'&&requested!=='SOUTH'?requested:'65';
let routeError='';
let hasVariants=false;
function searchStatus(){
 const messages={
 invalid:tr('請輸入巴士號碼，例如 K3。','Enter a bus number, such as K3.'),
 missing:tr('搵唔到呢條巴士路線。','Bus route not found.'),
 unavailable:tr('暫時未能從 TfL 讀取站序。','Could not load stops from TfL.'),
 };
 by('searchNote').textContent=messages[routeError]??(hasVariants?tr('有多個站序嘅方向會顯示最長嗰個。','Where a direction has variants, the longest stop sequence is shown.'):'');
}
by('routeSearch').onsubmit=event=>{
 event.preventDefault();
 const value=by('routeInput').value.trim().toUpperCase();
 if(!validLine.test(value)){routeError='invalid';searchStatus();return}
 location.search='?bus='+encodeURIComponent(value);
};
const destinations={};
const towards=dir=>tr('往 ','Towards ')+destinations[dir];
let direction=new URLSearchParams(location.search).get('route')==='south'?'inbound':'outbound';
const directions=['outbound','inbound'];
const nodes={};
let routes, stops=[], selected=0, predictions=[], updated=0, busy=false, failed=false, chosen=null;
function choose(i,scroll=true){
 selected=i;station.value=i;
 try{localStorage.setItem('bus'+line+'-stop-'+direction,stops[i][0])}catch{}
 render();
 if(scroll)reveal(direction,i);
}
function reveal(dir,index){
 const viewport=by(dir+'Viewport'),cell=nodes[dir][index].cell;
 viewport.scrollTop=cell.offsetTop-(viewport.clientHeight-cell.offsetHeight)/2;
}
function createTracks(){
 for(const dir of directions){
   const track=by(dir+'Track');
   track.replaceChildren();
   nodes[dir]=routes[dir].map(([id,name,letter],index)=>{
     const cell=document.createElement('div');cell.className='stop-cell';
     const node=document.createElement('button');node.className='stop-node';
     const label=document.createElement('button');label.className='station-label';
     label.textContent=name;
     if(letter){
       const span=document.createElement('span');span.className='station-letter';span.textContent=letter;label.append(span);
     }
     label.onclick=()=>{if(direction!==dir){direction=dir;setDirection(false)}choose(index,false)};
     cell.append(node,label);track.append(cell);return {cell,node,label};
   });
 }
}
function setDirection(scroll=true){
 for(const dir of directions){
   by(dir).hidden=!routes[dir].length;
   by(dir+'Panel').hidden=dir!==direction;
   by(dir).setAttribute('aria-pressed',String(dir===direction));
 }
 stops=routes[direction];chosen=null;
 station.replaceChildren();by('stopList').replaceChildren();
 stops.forEach(([id,name,letter],i)=>{
   const label=name+(letter?' · '+letter:'');
   station.add(new Option(label,i));
   const li=document.createElement('li'), button=document.createElement('button');
   button.textContent=label;button.onclick=()=>choose(i);li.append(button);by('stopList').append(li);
 });
 let savedStop;
 try{savedStop=localStorage.getItem('bus'+line+'-stop-'+direction)}catch{}
 const savedIndex=stops.findIndex(([id])=>id===savedStop);
 choose(Math.max(0,savedIndex),scroll);
}
function eta(p){const seconds=(Date.parse(p.expectedArrival)-Date.now())/1000;return seconds<=30?tr("即將到站","Due"):Math.ceil(seconds/60)+tr(" 分鐘"," min")}
function item(list,label,action){
 const li=document.createElement('li');
 if(action){const b=document.createElement('button');b.textContent=label;b.onclick=action;li.append(b)}
 else li.textContent=label;
 list.append(li);
}
function registration(p){
 const id=p.vehicleId.trim().toUpperCase().replace(/ /g,'');
 return /^[A-Z]{2}[0-9]{2}[A-Z]{3}$/.test(id)?id.slice(0,4)+' '+id.slice(4):null;
}
function renderFleet(vehicles,lookup){
 const list=by('fleetList');
 const buttons=new Map([...list.querySelectorAll('button')].map(button=>[button.dataset.id,button]));
 const ids=new Set(vehicles.map(p=>p.vehicleId));
 for(const child of [...list.children])if(!ids.has(child.dataset.id))child.remove();
 if(!vehicles.length){
   list.textContent=tr('暫無巴士預測。','No bus predictions.');
   return;
 }
 if(!list.children.length)list.textContent='';
 for(const p of vehicles){
   const button=buttons.get(p.vehicleId)??document.createElement('button');
   button.dataset.id=p.vehicleId;
   button.textContent=registration(p)??p.vehicleId;
   button.setAttribute('aria-pressed',String(chosen?.ids.has(p.vehicleId)??false));
   button.onclick=()=>{
     chosen={dir:direction,ids:new Set([p.vehicleId])};
     render();
     reveal(direction,Math.max(0,lookup.get(p.naptanId)-1));
   };
   if(!button.isConnected)list.append(button);
 }
}
function render(){
 if(!stops.length)return;
 by('stopSummary').textContent=tr('完整站序 · '+stops.length+' 個站','All stops · '+stops.length);
 const stale=updated&&Date.now()-updated>90000;
 const usable=updated&&!stale;
 const [stopId,name,letter]=stops[selected];
 const lookup=new Map(stops.map(([id],i)=>[id,i]));
 const fresh=usable?predictions.filter(p=>Date.parse(p.expectedArrival)>Date.now()-15000).sort((a,b)=>Date.parse(a.expectedArrival)-Date.parse(b.expectedArrival)):[];
 const records=fresh.filter(p=>p.direction===direction&&lookup.has(p.naptanId));
 const arrivals=records.filter(p=>p.naptanId===stopId);
 by('selectedStop').textContent=name+(letter?' · '+letter:'');
 by('centerEta').textContent=arrivals.length?eta(arrivals[0]):usable?tr("暫無預測","No predictions"):failed||stale?tr("未有資料","No data"):tr("讀取中","Loading");
 by('status').textContent=usable?tr("TfL 更新","Updated ")+new Date(updated).toLocaleTimeString('en-GB',{timeZone:'Europe/London'})+(failed?tr(" · 更新失敗，顯示上次資料","Refresh failed, showing last update"):tr(" · 倫敦時間","London time")):stale?tr("資料已過期，等候更新","Data expired, awaiting refresh"):failed?tr("暫時連唔到 TfL，請重試。","TfL unavailable. Try refreshing."):tr("讀取 TfL 資料中…","Loading TfL data\u2026");
 const list=by('arrivals');list.replaceChildren();
 if(!arrivals.length)item(list,usable?tr("TfL 暫時未有呢個站嘅預測。","No TfL predictions for this stop."):tr("等候即時到站資料。","Waiting for live arrivals."));
 else arrivals.slice(0,3).forEach(p=>item(list,eta(p)));
 const groups={outbound:new Map(),inbound:new Map()};
 const routeIds=Object.fromEntries(directions.map(dir=>[dir,new Set(routes[dir].map(row=>row[0]))]));
 const seen=new Set();
 for(const p of fresh){
   if(!p.vehicleId||seen.has(p.vehicleId)||!routeIds[p.direction]?.has(p.naptanId))continue;
   seen.add(p.vehicleId);
   const line=groups[p.direction];
   if(!line.has(p.naptanId))line.set(p.naptanId,[]);
   line.get(p.naptanId).push(p);
 }
 for(const dir of directions){
   routes[dir].forEach(([id,name],index)=>{
     const {node,label}=nodes[dir][index];
     const group=groups[dir].get(id)??[];
     const isSelected=dir===direction&&index===selected;
     node.dataset.selected=String(isSelected);
     label.setAttribute('aria-pressed',String(isSelected));
     const following=routes[dir][index+1];
     const current=following?groups[dir].get(following[0])??[]:[];
     const vehicles=[...current,...group];
     node.classList.toggle('current',current.length>0);
     node.classList.toggle('next',group.length>0);
     node.classList.toggle('tracked',chosen?.dir===dir&&current.some(p=>chosen.ids.has(p.vehicleId)));
     node.setAttribute('aria-label',[name,current.length?tr("巴士推算位置","Estimated bus position"):'',group.length?tr("巴士預計下一站","Expected next stop"):''].filter(Boolean).join(' · '));
     node.onclick=vehicles.length?()=>{chosen={dir,ids:new Set(vehicles.map(p=>p.vehicleId))};render()}:label.onclick;
   });
 }
 const fleet=[...groups[direction].values()].flat().sort((a,b)=>a.vehicleId.localeCompare(b.vehicleId));
 renderFleet(fleet,lookup);
 const details=by('vehicleList');details.replaceChildren();
 if(chosen){
   const active=[...groups[chosen.dir].values()].flat().filter(p=>chosen.ids.has(p.vehicleId));
   const destination=towards(chosen.dir);
   by('vehicleDetail').textContent=active.length?destination+tr(' · 預計下一站',' · Next stop'):tr("暫無位置預測。","No position estimate available.");
   active.forEach(p=>{
     const reg=registration(p);
     const plate=reg?tr('車牌 ','Reg ')+reg:tr('車輛編號 ','Vehicle ID ')+p.vehicleId;
     const next=lookup.get(p.naptanId);
     const position=next>0?tr('推算位置 ','Estimated position ')+stops[next-1][1]:tr('預計由總站開出','Expected to depart terminus');
     item(details,plate+' · '+position+' → '+p.stationName+' · '+eta(p));
   });
 }else{
   const count=fleet.length;
   by('vehicleDetail').textContent=count?tr(count+' 架車有預測，撳黃燈睇詳情。',count+' bus'+(count===1?'':'es')+' with predictions. Select a yellow light.'):tr("暫無巴士位置。","No bus positions available.");
 }
}

async function refresh(){
 if(busy||!routes)return;
 busy=true;
 try{
   const response=await fetch('https://api.tfl.gov.uk/Line/'+line+'/Arrivals',{cache:'no-store',signal:AbortSignal.timeout(12000)});
   if(!response.ok)throw Error(response.status);
   const data=await response.json();
   if(!Array.isArray(data))throw Error('Invalid arrivals');
   predictions=data;updated=Date.now();failed=false;
 }catch{failed=true}
 finally{busy=false;render()}
}
for(const dir of directions)by(dir).onclick=()=>{if(routes?.[dir]?.length&&direction!==dir){direction=dir;setDirection()}};
station.onchange=()=>choose(Number(station.value));
async function start(){
 try{
   if(line==='65'||line==='371'){
     const response=await fetch(line==='65'?'stops.json':'stops-371.json');
     if(!response.ok)throw Error(response.status);
     routes=await response.json();
   }else{
     const results=await Promise.all(directions.map(async dir=>{
       const url='https://api.tfl.gov.uk/Line/'+encodeURIComponent(line)+'/Route/Sequence/'+dir;
       const response=await fetch(url,{signal:AbortSignal.timeout(15000)});
       if(response.status===404)return [];
       if(!response.ok)throw Error(response.status);
       const data=await response.json();
       if(data.mode&&data.mode!=='bus')return [];
       const sequences=(data.stopPointSequences??[]).filter(seq=>seq.stopPoint?.length);
       hasVariants ||= sequences.length>1;
       const longest=sequences.sort((a,b)=>b.stopPoint.length-a.stopPoint.length)[0];
       return (longest?.stopPoint??[]).map(stop=>[stop.id,stop.name,stop.stopLetter??'']);
     }));
     if(!results.some(stops=>stops.length)){routeError='missing';throw Error('Route not found')}
     routes=Object.fromEntries(directions.map((dir,i)=>[dir,results[i]]));
   }
   if(!routes[direction].length)direction=directions.find(dir=>routes[dir].length);
   for(const [dir,key] of [['outbound','out'],['inbound','in']]){
     const last=routes[dir].at(-1);
     if(!last)continue;
     destinations[dir]=last[1];
     by(dir).textContent=destinations[dir];
     copy[key]=['往 '+destinations[dir],'Towards '+destinations[dir]];
     copy[key+'Scroll']=['往 '+destinations[dir]+' 全線站名','All stops towards '+destinations[dir]];
   }
   createTracks();applyLanguage();
   setDirection();refresh();setInterval(refresh,30000);setInterval(render,5000);
 }catch{stopsFailed=true;routeError ||= 'unavailable';applyLanguage()}
}
by('routeNumber').textContent=line;
by('routeInput').value=line;
for(const dir of directions)by(dir).hidden=true;
for(const route of ['65','371']){
 const button=by('route'+route);
 button.setAttribute('aria-pressed',String(route===line));
 button.onclick=()=>{if(route!==line)location.search='?route='+route};
}
const official=document.querySelector('[data-copy="official"]');
official.href='https://tfl.gov.uk/bus/route/'+line+'/';
copy.official=['TfL '+line+' 官方路線','Official TfL route '+line];
applyLanguage();
if(!params.has('bus')&&params.get('route')==='sl7')location.replace('map.html?route=sl7');else start();
</script>
</html>
