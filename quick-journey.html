<script type="module">
const languageKey='bus-tracker-language';
function readLanguage(){
 try{
  const saved=localStorage.getItem(languageKey);
  if(saved==='zh'||saved==='en')return saved;
  for(const key of ['bus65-language','rail-journey-language']){
   const legacy=localStorage.getItem(key);
   if(legacy==='zh'||legacy==='en'){try{localStorage.setItem(languageKey,legacy)}catch{}return legacy;}
  }
  localStorage.setItem(languageKey,'zh');
 }catch{}
 return 'zh';
}
function saveLanguage(value){try{localStorage.setItem(languageKey,value)}catch{}}
let language=readLanguage();
const messages={
 title:['一句查路線 · London Journey','Quick journey search · London Journey'],
 brand:['倫敦交通行程','LONDON JOURNEY'],heading:['一句查路線','Quick journey search'],
 intro:['用廣東話或英文打一句，即可喺 Journey 查路線。','Type a sentence in Cantonese or English to find a route in Journey.'],
 navigation:['倫敦交通','London transport'],journeys:['倫敦交通行程','London Transport Journeys'],tracker:['倫敦交通追蹤','London Transport Tracker'],
 question:['你想去邊？','Where would you like to go?'],sentencePlaceholder:['我想去 Waterloo','I want to go to Waterloo'],search:['查路線','Find journey'],
 locationHint:['只打目的地時，頁面會請求定位，用你嘅位置向 TfL 查路線。','If you only enter a destination, this page will ask for your location to find a route with TfL.'],
 examples:['試用例句','Try an example'],example1:['由 Durlston Road 去 Waterloo','From Durlston Road to Waterloo'],
 example2:['我喺 Richmond Station 等車，想去 Kingston','From Richmond Station to Kingston'],
 example3:['聽朝九點由 Richmond 去 Victoria','09:00 from Richmond to Victoria'],
 endpoints:['出發地同目的地','Starting point and destination'],from:['出發地','From'],to:['目的地','To'],
 startPoint:['出發地','Starting point'],startPlaceholder:['例如 Richmond Station','For example, Richmond Station'],useStart:['用呢個起點','Use this start'],
 footerBefore:['交通資料由 ','Transport data provided by '],footerAfter:[' 提供 · 倫敦時間',' · London time'],
 currentLocation:['目前位置','Current location'],leaveNow:['而家出發','Leave now'],arriveBy:['到達期限 ','Arrive by '],departAt:['出發時間 ','Depart at '],
 londonTime:['（倫敦時間）',' (London time)'],confirm:['確認並開啟 Journey','Confirm and open Journey'],confirmHint:['請確認出發地、目的地同時間。','Please confirm your starting point, destination and time.'],
 chooseFrom:['揀出發站','Choose a starting stop or station'],chooseTo:['揀目的地','Choose a destination'],bus:['巴士','Bus'],
 invalidTime:['時間格式有問題。試吓「聽朝九點」或「14:30」。','Invalid time. Try a time such as 09:00 or 14:30.'],
 pastTime:['你揀嘅時間已經過咗。試吓加「聽日」。','That time has already passed. Please choose a future time.'],
 missingDestination:['請補返目的地。','Please enter a destination.'],samePlace:['出發地同目的地要唔同。','Your starting point and destination must be different.'],
 notFound:['搵唔到「{place}」。試吓用完整英文站名。','Could not find “{place}”. Try the full English stop or station name.'],
 sameStation:['請揀兩個唔同嘅車站。','Please choose two different stops or stations.'],
 handoffFailed:['瀏覽器未能交接搜尋。你可以用上面嘅「Journey」連結手動查路線。','Your browser could not pass this search to Journey. Use the London Transport Journeys link above to search manually.'],
 opening:['開緊 Journey…','Opening Journey…'],locating:['搵緊你嘅目前位置…','Finding your current location…'],lookingUp:['查緊站名…','Looking up stops and stations…'],
 stationsFailed:['暫時讀取唔到 TfL 站名。請再試。','Could not load stop and station names from TfL. Please try again.'],
 startFailed:['暫時讀取唔到站名，請再試。','Could not load stop and station names. Please try again.'],
 locationUnsupported:['呢個瀏覽器未能定位。請輸入出發地，或者打「由［出發地］去［目的地］」。','Location is unavailable in this browser. Enter a starting point below, or type “from [start] to [destination]”.'],
 locationDenied:['瀏覽器未有定位權限。請輸入出發地，或者打「由［出發地］去［目的地］」。','Location permission was refused. Enter a starting point below, or type “from [start] to [destination]”.'],
 locationFailed:['暫時攞唔到你嘅位置。請輸入出發地，或者打「由［出發地］去［目的地］」。','Could not get your location. Enter a starting point below, or type “from [start] to [destination]”.']
};
function message(key,params={}){return messages[key][language==='en'?1:0].replace(/\{(\w+)\}/g,(_,name)=>params[name]??'');}
let statusState={key:null,params:{}};
function setStatus(key=null,params={}){statusState={key,params};status.textContent=key?message(key,params):'';}
function stopDisplay(stop,includeRoutes=false){return stop.location?message('currentLocation'):TransportStops.busOnly(stop)?TransportStops.describe(stop,language,includeRoutes):stop.name;}
function applyLanguage(){
 document.documentElement.lang=language==='en'?'en':'zh-Hant';
 document.title=message('title');
 for(const el of document.querySelectorAll('[data-i18n]'))el.textContent=message(el.dataset.i18n);
 for(const el of document.querySelectorAll('[data-i18n-placeholder]'))el.placeholder=message(el.dataset.i18nPlaceholder);
 for(const el of document.querySelectorAll('[data-i18n-aria]'))el.setAttribute('aria-label',message(el.dataset.i18nAria));
 document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===language)));
 if(input.validity.customError)input.setCustomValidity(message('missingDestination'));
 if(active&&!stations.hidden){
  for(const stop of Object.values(active.selected))if(stop.location)stop.name=message('currentLocation');
  showParsing(active);
  if(choices.children.length)selectStations(active,false,false);
 }
 setStatus(statusState.key,statusState.params);
}
const londonDate = new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
});
const digits = '零一二三四五六七八九';
const arrivalVerb = '(?:返回到|返到|抵達|抵达|到達|到达|到)';
const timedArrival = new RegExp('^\\s*(?:(?:要|想|希望|準時|准时)\\s*)*' + arrivalVerb, 'u');
const journeySeparator = new RegExp(arrivalVerb + '|去|返|→|->|\\bto\\b', 'iu');
const clockPattern = /(?:(聽日|聽朝|明日|明天|今日|今天)\s*)?(?:(凌晨|朝早|早上|上午|中午|晏晝|下午|夜晚|晚上)\s*)?([0-9]{1,2}|[零〇一二兩两三四五六七八九十]{1,3})(?::([0-9]{2})|[點点時时]\s*(半|[0-9]{1,2}\s*分)?)(\s*(?:之前|以前|前))?/u;

function hourValue(text) {
  if (/^\d+$/.test(text)) return Number(text);
  const number = char => digits.indexOf(char?.replace(/[兩两]/, '二').replace('〇', '零'));
  if (!text.includes('十')) return text.length === 1 ? number(text) : NaN;
  const parts = text.split('十');
  if (parts.length !== 2 || parts.some(part => part.length > 1)) return NaN;
  return (parts[0] ? number(parts[0]) : 1) * 10 + (parts[1] ? number(parts[1]) : 0);
}

function timingFrom(text, now) {
  const clock = text.match(clockPattern);
  if (!clock) return { text };
  const [expression, day, period, digits, minutes, suffix, before] = clock;
  let hour = hourValue(digits);
  const minute = Number(minutes ?? (suffix === '半' ? '30' : suffix?.replace(/\s*分$/, '') ?? '0'));
  if (!Number.isInteger(hour) || hour < 0 || hour > 23 || minute > 59) {
    return { error: message('invalidTime'), errorKey:'invalidTime' };
  }
  if (/^(中午|晏晝|下午|夜晚|晚上)$/.test(period) && hour < 12) hour += 12;
  if (period === '凌晨' && hour === 12) hour = 0;
  const local = Object.fromEntries(londonDate.formatToParts(now).map(({type, value}) => [type, value]));
  const time = String(hour).padStart(2, '0') + String(minute).padStart(2, '0');
  const nextDay = day && /^(聽日|聽朝|明日|明天)$/.test(day);
  const passed = time < local.hour + local.minute;
  if (day && !nextDay && passed) return { error: message('pastTime'), errorKey:'pastTime' };
  const date = new Date(Date.UTC(+local.year, +local.month - 1, +local.day + Number(Boolean(nextDay || (!day && passed))))).toISOString().slice(0, 10);
  const context = text.slice(clock.index + expression.length);
  const timeIs = before || timedArrival.test(context) ? 'arriving' : 'departing';
  return { text: text.slice(0, clock.index) + ' ' + context, timing: { date: date.replaceAll('-', ''), time, timeIs } };
}

function place(text) {
  return text.replace(/^[\s，,。；;：:！!？?]+|[\s，,。；;：:！!？?]+$/gu, '').trim();
}

function parseJourney(input, now = new Date()) {
  const prepared = timingFrom(input.normalize('NFKC').trim(), now);
  if (prepared.error) return prepared;
  const text = prepared.text.replace(/\s+/g, ' ').trim()
    .replace(/^(?:(?:請問|幫我|我想|我要|我|想|要|希望)\s*)+/u, '')
    .replace(/^(?:i want to (?:go|travel)|how do i get|go)\s+(?=(?:from|to)\b)/iu, '');
  const originPrefix = /^(?:由|從|从|喺|係|在|from\b)\s*/iu;
  const route = text.replace(originPrefix, '');
  const split = route.match(journeySeparator);
  if (!split && originPrefix.test(text)) return { error: message('missingDestination'), errorKey:'missingDestination' };
  const origin = split ? place(route.slice(0, split.index)
    .replace(/(?:[\s，,；;]+|出發|出发|等車|等车|想|要|希望|準時|准时|然後|然后)+$/u, '')) : '';
  const from = /^(?:我?(?:而家(?:嘅)?|目前(?:嘅)?|依家(?:嘅)?)位置|這裡|呢度|here|(?:my )?current location)$/iu.test(origin)
    ? null : origin || null;
  const to = place((split ? route.slice(split.index + split[0].length) : route)
    .replace(/(?:呀|啊|啦|點去|怎么去)[\s。！？!?]*$/u, ''));
  if (!to) return { error: message('missingDestination'), errorKey:'missingDestination' };
  if (from?.toLowerCase() === to.toLowerCase()) return { error: message('samePlace'), errorKey:'samePlace' };
  return { from, to, timing: prepared.timing };
}

const modes = ['bus', 'tube', 'overground', 'elizabeth-line', 'dlr', 'national-rail'];
const modeNames = {bus:'巴士', tube:'Tube', overground:'Overground', 'elizabeth-line':'Elizabeth line', dlr:'DLR', 'national-rail':'National Rail'};
const form = document.querySelector('#search-form');
const input = document.querySelector('#sentence');
const submit = form.querySelector('[type="submit"]');
const status = document.querySelector('#status');
const stations = document.querySelector('#stations');
const endpoints = document.querySelector('#endpoints');
const timing = document.querySelector('#timing');
const choices = document.querySelector('#choices');
let active;

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

async function api(path, params, signal) {
  const url = new URL(path, 'https://api.tfl.gov.uk/');
  url.search = new URLSearchParams(params);
  const response = await fetch(url, {signal:AbortSignal.any([signal, AbortSignal.timeout(18000)])});
  if (!response.ok) throw new Error(String(response.status));
  return response.json();
}

function stationRank(name, search) {
  const value = name.toLowerCase().trim();
  if (value === search) return 0;
  if (value.replace(/^london /, '').replace(/ (?:underground |rail |dlr )?station$/, '') === search) return 0;
  return value.startsWith(search + ' ') || value.startsWith(search + ' /') ? 1 : 2;
}

async function findStations(query, signal) {
  const data = await api('StopPoint/Search/' + encodeURIComponent(query), {modes:modes.join(','), maxResults:30}, signal);
  const search = query.toLowerCase();
  const options=await TransportStops.enrich((data.matches??[]).filter(stop=>stop.id&&stop.name&&stop.modes?.some(mode=>modes.includes(mode))),signal);
  const unique=new Map();
  for(const stop of options){
    const served=stop.modes.filter(mode=>modes.includes(mode));
    const busOnly=TransportStops.busOnly(stop);
    const id=busOnly?stop.id:stop.icsId||stop.icsCode||stop.id;
    const key=busOnly?stop.id:id+'|'+stop.name.toLowerCase();
    const candidate={...stop,id,modes:served,display:busOnly?TransportStops.describe(stop,language,false):stop.name,rank:stationRank(stop.name,search)};
    if(!unique.has(key)||candidate.rank<unique.get(key).rank)unique.set(key,candidate);
  }
  return [...unique.values()].sort((a,b)=>a.rank-b.rank||a.name.localeCompare(b.name)).slice(0,12);
}

function showParsing(state) {
  stations.hidden = false;
  endpoints.replaceChildren();
  for (const key of ['from','to']) {
    const item = element('div', undefined, 'endpoint');
    item.append(element('span', message(key)), element('strong', state.selected[key]?stopDisplay(state.selected[key]):state.parsed[key]??message('currentLocation')));
    endpoints.append(item);
  }
  const value = state.parsed.timing;
  timing.hidden = false;
  if (value) {
    const day = value.date.replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3');
    timing.textContent = message(value.timeIs === 'arriving' ? 'arriveBy' : 'departAt') +
      day + ' · ' + value.time.slice(0,2) + ':' + value.time.slice(2) + message('londonTime');
  } else timing.textContent=message('leaveNow');
}

function selectStations(state,focus=true,updateStatus=true) {
  showParsing(state);
  choices.replaceChildren();
  const key = ['from','to'].find(side => !state.selected[side]);
  if (!key) {
    const button=element('button',message('confirm'));
    button.type='button';button.className='primary';
    button.onclick=()=>{if(active===state)openJourney(state)};
    choices.append(button);
    if(updateStatus)setStatus('confirmHint');
    if(focus)button.focus();
    return;
  }
  const candidates = state.candidates[key];
  if (!candidates.length) {
    if(updateStatus)setStatus('notFound',{place:state.parsed[key]});
    return;
  }
  const title = element('strong', message(key === 'from' ? 'chooseFrom' : 'chooseTo'));
  choices.append(title);
  for (const candidate of candidates) {
    const button = element('button', stopDisplay(candidate,true));
    button.type = 'button';
    button.append(element('small', candidate.modes.map(mode => mode==='bus'?message('bus'):modeNames[mode]).join(' · ')));
    button.onclick = () => {
      if (active !== state) return;
      state.selected[key] = candidate;
      selectStations(state);
    };
    choices.append(button);
  }
  if(updateStatus)setStatus();
  if(focus)choices.querySelector('button')?.focus();
}

function openJourney(state) {
  const {from,to} = state.selected;
  if (from.id === to.id) {
    setStatus('sameStation');
    return;
  }
  try {
    sessionStorage.setItem('quick-journey-request-v1', JSON.stringify({
      from: {id:from.id, name:from.name, location:!state.parsed.from},
      to: {id:to.id, name:to.name},
      timing: state.parsed.timing
    }));
  } catch {
    setStatus('handoffFailed');
    return;
  }
  submit.disabled = true;
  setStatus('opening');
  location.assign('./journeys.html?quick=1');
}

function locateOrigin() {
  if (!navigator.geolocation) return Promise.reject(Object.assign(new Error(message('locationUnsupported')),{messageKey:'locationUnsupported'}));
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(({coords}) => {
      resolve({id:coords.latitude.toFixed(6) + ',' + coords.longitude.toFixed(6), name:message('currentLocation'),location:true});
    }, error => {
      const messageKey=error.code===1?'locationDenied':'locationFailed';
      reject(Object.assign(new Error(message(messageKey)),{messageKey}));
    }, {timeout:12000, maximumAge:0});
  });
}

async function search(event) {
  event.preventDefault();
  active?.controller.abort();
  active = undefined;
  document.querySelector('#startRecovery').hidden=true;
  stations.hidden = true;
  choices.replaceChildren();
  const parsed = parseJourney(input.value);
  if (parsed.error) {
    setStatus(parsed.errorKey);
    return;
  }
  const state = {parsed, controller:new AbortController(), selected:{}, candidates:{}};
  active = state;
  showParsing(state);
  submit.disabled = true;
  if (!parsed.from) {
    setStatus('locating');
    try {
      const origin = await locateOrigin();
      if (active !== state) return;
      state.selected.from = origin;
    } catch (error) {
      if (active === state) {
        setStatus(error.messageKey||'locationFailed');
        document.querySelector('#startRecovery').hidden=false;
        document.querySelector('#startPoint').focus();
        submit.disabled = false;
      }
      return;
    }
  }
  setStatus('lookingUp');
  try {
    const keys = parsed.from ? ['from','to'] : ['to'];
    const matches = await Promise.all(keys.map(key => findStations(parsed[key], state.controller.signal)));
    if (active !== state) return;
    keys.forEach((key,index) => {
      const exact = matches[index].filter(stop => stop.rank === 0);
      state.candidates[key] = exact.length ? exact : matches[index];
      if (exact.length === 1) state.selected[key] = exact[0];
      else if (matches[index].length === 1) state.selected[key] = matches[index][0];
    });
  } catch {
    if (active !== state) return;
    setStatus('stationsFailed');
    return;
  } finally {
    if (active === state) submit.disabled = false;
  }
  await selectStations(state);
}

document.querySelector('#useStart').onclick=()=>{
  if(!active)return;
  const start=document.querySelector('#startPoint').value.trim();
  if(!start){document.querySelector('#startPoint').focus();return}
  const state=active;
  state.parsed.from=start;
  document.querySelector('#startRecovery').hidden=true;
  showParsing(state);
  submit.disabled=true;
  Promise.all(['from','to'].map(key=>findStations(state.parsed[key],state.controller.signal))).then(matches=>{
    if(active!==state)return;
    ['from','to'].forEach((key,index)=>{
      const exact=matches[index].filter(stop=>stop.rank===0);
      state.candidates[key]=exact.length?exact:matches[index];
      if(exact.length===1)state.selected[key]=exact[0];
      else if(matches[index].length===1)state.selected[key]=matches[index][0];
    });
    selectStations(state);
  }).catch(()=>{if(active===state)setStatus('startFailed')}).finally(()=>{if(active===state)submit.disabled=false});
};
form.onsubmit = search;
input.addEventListener('invalid',()=>{if(input.validity.valueMissing)input.setCustomValidity(message('missingDestination'))});
input.oninput = () => {
  input.setCustomValidity('');
  active?.controller.abort();
  active = undefined;
  submit.disabled = false;
  setStatus();
  document.querySelector('#startRecovery').hidden=true;
  stations.hidden = true;
};
for (const example of document.querySelectorAll('.examples button')) {
  example.onclick = () => {
    input.value = example.textContent;
    input.oninput();
    form.requestSubmit();
  };
}

window.addEventListener('pageshow', event => {
  if (!event.persisted) return;
  submit.disabled = false;
  setStatus();
});
document.querySelectorAll('[data-lang]').forEach(button=>button.onclick=()=>{
 language=button.dataset.lang;saveLanguage(language);applyLanguage();
});
function syncLanguage(){const saved=readLanguage();if(saved!==language){language=saved;applyLanguage();}}
window.addEventListener('storage',event=>{if(event.key===languageKey||event.key===null)syncLanguage()});
window.addEventListener('pageshow',syncLanguage);
applyLanguage();
</script>
