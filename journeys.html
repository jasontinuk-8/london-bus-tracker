   ${tracker?`<a class="board" data-tracker-vehicle href="${html(tracker)}">`:`<button type="button" class="board" data-train-map aria-expanded="false" aria-controls="train-map-${legIndex}">`}<span class="board-heading">${bus?tr('下一班巴士','Next bus'):tr('下一班車','Next train')}</span><span><small>${tr('目的地','Destination')}</small><strong data-head>${html(heads.join(' / ')||tr('請睇站內顯示屏','Check the station display'))}</strong></span>
   <span class="eta"><small>${tr('到站','Arrival')}</small><strong data-eta>${tr('查詢中…','Checking…')}</strong></span><small class="map-action">${bus?tr('喺 Tracker 睇巴士位置','See bus location in Tracker'):tracker?tr('喺 Tracker 睇列車位置','See train location in Tracker'):tr('睇列車位置','Show train location')}</small>${tracker?'</a>':'</button>'}
   ${tracker?'':`<div class="train-map-panel" id="train-map-${legIndex}" hidden><p class="muted" data-train-location role="status"></p><div class="train-diagram" data-train-diagram role="region" tabindex="0" aria-label="${tr('列車位置路線圖','Train position diagram')}"></div></div>`}
   <p class="alight">${tr('喺 ','Get off at ')}${html(end)}${tr(' 落車','')}${hasChange?`<span class="interchange-time" data-interchange>${tr('預計到達轉車站','Expected at interchange')} · ${time(leg.arrivalTime)}</span>`:''}</p>
   <details class="next-trains" data-next-leg="${legIndex}"><summary>${bus?tr('睇之後幾班巴士','Next buses'):tr('睇下一班車','Next trains')}</summary><div data-train-list role="status"></div></details>
   <details data-map-leg="${legIndex}"><summary>${tr('睇沿途車站同地圖','Show stops and map')}</summary><div class="stops-map" role="region" aria-label="${tr('沿途車站地圖','Map of stops')}"></div><p class="muted" data-map-note></p><ol>${[start,...stops,end].map(name=>'<li>'+html(name)+'</li>').join('')}</ol></details></article>`;
 }).join('')}
 <p class="muted">${tr('資料由 Transport for London 提供 · 倫敦時間','Data from Transport for London · London time')}</p>`;
 const journeyMap=result.querySelector('[data-journey-map]');
 journeyMap.ontoggle=()=>showJourneyMap(journeyMap,journey);
 if(journeyMap.open)showJourneyMap(journeyMap,journey);
 result.querySelectorAll('[data-plan]').forEach(button=>button.onclick=()=>{
  render(Number(button.dataset.plan));
  result.querySelector('[aria-pressed="true"]').focus();
 });
 result.querySelectorAll('[data-next-leg]').forEach(details=>{
  const index=Number(details.dataset.nextLeg);
  details.ontoggle=()=>showNextTrains(details,journey.legs[index],predictions.get(index).ready);
 });
 result.querySelectorAll('[data-map-leg]').forEach(details=>details.ontoggle=()=>showStopMap(details,journey.legs[Number(details.dataset.mapLeg)]));
 const liveCards=[...result.querySelectorAll('[data-transit-leg]')];
 liveCards.forEach(card=>{
  const index=Number(card.dataset.transitLeg);
  const leg=journey.legs[index];
  const button=card.querySelector('[data-train-map]');
  const panel=card.querySelector('.train-map-panel');
  if(button)button.onclick=async()=>{
   panel.hidden=!panel.hidden;
   button.setAttribute('aria-expanded',String(!panel.hidden));
   if(panel.hidden)return;
   const note=panel.querySelector('[data-train-location]');
   if(!note.textContent)note.textContent=tr('查詢車輛位置…','Finding vehicle position…');
   const {train}=await predictions.get(index).trip;
   if(version===view&&!panel.hidden)await showTrainMap(panel,leg,train,version);
  };
 });
 async function updateLiveCard(card,current){
  const index=Number(card.dataset.transitLeg);
  const leg=journey.legs[index];
  const {train,arrival}=await current.get(index).trip;
  if(version!==view||predictions!==current)return;
  const trackerLink=card.querySelector('[data-tracker-vehicle]');
  if(trackerLink)trackerLink.href=trackerUrl(leg,index,train);
  const interchange=card.querySelector('[data-interchange]');
  if(interchange)interchange.textContent=tr('預計到達轉車站','Expected at interchange')+' · '+londonTime.format(arrival);
  const eta=card.querySelector('[data-eta]');
  eta.previousElementSibling.textContent=tr('到站','Arrival');
  card.querySelector('[data-platform]').textContent=boardingLabel(leg,train);
  card.querySelector('[data-head]').textContent=train?trainDestination(train):
   headsigns(leg).join(' / ')||tr('請睇站內顯示屏','Check the station display');
  if(!train){eta.textContent=tr('暫無即時預測','No live prediction');return;}
  const expected=new Date(train.expectedArrival);
  if(train.scheduled){
   eta.previousElementSibling.textContent=tr('預定開車','Scheduled departure');
   eta.textContent=londonTime.format(expected);
   return;
  }
  if(train.atPlatform)eta.previousElementSibling.textContent=tr('狀態','Status');
  function tick(){
   if(version!==view||predictions!==current)return;
   const minutes=Math.ceil((expected.getTime()-Date.now())/60000);
   eta.textContent=minutes>0?(train.atPlatform?tr('已在月台','At platform'):londonTime.format(expected)+' · '+minutesLabel(minutes)):
    leg.mode.id==='bus'?tr('即將到站','Due'):tr('請睇站內顯示屏','Check the station display');
   if(minutes>0)setTimeout(tick,1000);
  }
  tick();
 }
 if(!liveCards.length)return;
 let refreshing=false;
 async function refreshPredictions(initial=false){
  if(refreshing||(!initial&&document.hidden)||version!==view)return;
  refreshing=true;
  try{
   arrivalsCache.clear();
   predictions=connectionPredictions(journey.legs);
   await Promise.allSettled(liveCards.map(card=>updateLiveCard(card,predictions)));
  }finally{refreshing=false;}
 }
 refreshPredictions(true);
 journeyRefreshTimer=setInterval(refreshPredictions,30000);
}
async function plan(event){
 event?.preventDefault();
 if(!form.reportValidity())return;
 const timing=journeyTimeMode.value==='now'?null:{
  mode:journeyTimeMode.value,date:journeyDate.value,clock:journeyTime.value
 };
 const scheduleParams=journeyTimeParams(timing);
 const version=++request;
 clearInterval(journeyRefreshTimer);
 clearStopMaps();
 model=null;
 ++view;
 arrivalsCache.clear();
 submit.disabled=true;
 fields.forEach(field=>field.choices.hidden=true);
 result.innerHTML='<p class="panel" role="status">'+tr('正在向 TfL 查詢行程…','Finding journeys with TfL…')+'</p>';
 try{
  const [from,to]=await Promise.all(fields.map(resolve));
  if(from.id===to.id)throw Object.assign(Error(tr("請揀兩個唔同嘅地點。","Choose two different locations.")),{name:'PlannerMessage'});
  const path=journeyPath(from.id,to.id);
  const searches=['leasttime','leastinterchange'].map(journeyPreference=>api(path,{mode:modes+',walking',journeyPreference,...scheduleParams}));
  const responses=await Promise.allSettled([...searches,api(path,{mode:'walking',...scheduleParams})]);
  if(responses.every(response=>response.status==='rejected'))throw responses[0].reason;
  const seen=new Set();
  const options=responses.flatMap(response=>response.status==='fulfilled'?response.value.journeys??[]:[])
   .filter(journey=>journey.legs?.length&&journey.legs.every(leg=>transitLeg(leg)||walkingLeg(leg)))
   .sort((a,b)=>String(a.arrivalDateTime).localeCompare(String(b.arrivalDateTime))).filter(journey=>{
    const key=journeySignature(journey);
    if(seen.has(key))return false;
    seen.add(key);return true;
   });
  if(version!==request)return;
  if(!options.length)throw Object.assign(Error(tr("TfL 暫時搵唔到合適嘅行程。試下輸入附近巴士站或車站。","TfL found no suitable journeys. Try a nearby stop or station.")),{name:'PlannerMessage'});
  const direct=options.filter(option=>option.legs.filter(transitLeg).length===1);
  const walkOnly=options.find(option=>option.legs.every(walkingLeg));
  const journeys=[...new Set([options[0],direct[0],walkOnly,...options].filter(Boolean))].slice(0,3);
  journeyEndpoints=[from,to];
  model={from:from.name,to:to.name,location:from.location,journeys,earliest:options[0].arrivalDateTime,timing};
  render();
 }catch(error){
  if(version!==request)return;
  const message=error.name==='PlannerMessage'?error.message:error.message==='300'||error.message==='404'?tr("請揀搜尋建議入面嘅車站，或者輸入更完整嘅地點。","Choose a suggested station or enter a more specific location."):tr("暫時未能向 TfL 取得行程，請再試一次。","Could not get journeys from TfL. Please try again.");
  result.innerHTML='<p class="empty" role="status">'+html(message)+'</p>';
 }finally{if(version===request)submit.disabled=false;}
}
form.onsubmit=plan;
clearJourneyButton.onclick=clearJourney;
document.querySelector('#locate').onclick=()=>{
 const status=document.querySelector('#location-status');
 if(!navigator.geolocation){status.textContent=tr("呢個瀏覽器未能提供定位。","Location is unavailable in this browser.");return;}
 status.textContent=tr("搵緊你嘅位置…","Finding your location…");
 const version=++locationRequest;
 navigator.geolocation.getCurrentPosition(({coords})=>{
  if(version!==locationRequest)return;
  const field=fields[0];
  field.input.value=tr("目前位置","Current location");
  field.selected={id:coords.latitude.toFixed(5)+','+coords.longitude.toFixed(5),name:tr("目前位置","Current location"),location:true};
  field.choices.hidden=true;
  status.textContent=tr("已設定目前位置。按「睇行程」後會交畀 TfL 查詢。","Current location set. Find journeys to send it to TfL.");
 },()=>{if(version===locationRequest)status.textContent=tr("未能取得位置，可以手動輸入。","Could not get your location. You can type a starting point.");},{timeout:10000});
};
document.querySelectorAll('[data-lang]').forEach(button=>button.onclick=()=>{
 language=button.dataset.lang;
 try{localStorage.setItem('rail-journey-language',language);}catch{}
 applyLanguage();
});
const returningToJourney=/^#journey-leg-\d+$/.test(location.hash);
if(returningToJourney)restoreJourney();
applyLanguage();
if(returningToJourney&&model){
 requestAnimationFrame(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView());
}
</script>
